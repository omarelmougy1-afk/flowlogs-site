<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Flowlogs device preview</title>
<meta content="See the Flowlogs landing pages on a phone, a tablet and a desktop, with rulers, guides and layout columns." name="description"/>
<meta content="noindex" name="robots"/>
<link href="img/logo-144.png" rel="icon"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<style>
  :root {
    --blue: #0C66E4; --blue-hover: #0055CC; --ink: #172B4D; --navy: #091E42; --muted: #626F86;
    --line: #DCDFE4; --panel: #FFFFFF; --bar: #F7F8F9; --chip: #F1F2F4; --stage: #F4F5F7;
    --stage-line: rgba(9, 30, 66, 0.05); --guide: #00A3BF; --guide-active: #0C66E4;
  }
  body[data-theme="dark"] {
    --ink: #DEE4EA; --muted: #9FADBC; --line: #38414A; --panel: #1D2125; --bar: #22272B;
    --chip: #2C333A; --stage: #161A1D; --stage-line: rgba(255, 255, 255, 0.04); --blue: #579DFF; --blue-hover: #85B8FF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 400 14px/20px 'IBM Plex Sans', system-ui, sans-serif; color: var(--ink);
    background: var(--navy); display: flex; padding: clamp(0px, 2vw, 28px);
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .panel {
    flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel);
    border-radius: 16px; overflow: hidden; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
  }
  @media (max-width: 640px) { .panel { border-radius: 0; } }

  /* Header */
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 14px 20px 10px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand img { width: 36px; height: 36px; border-radius: 8px; }
  .brand h1 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .brand p { margin: 0; font-size: 13px; color: var(--muted); }
  .top-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .link { color: var(--blue); font-weight: 500; text-decoration: none; font-size: 13px; }
  .link:hover { text-decoration: underline; }

  /* Toolbar */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 20px 12px; padding: 6px;
    background: var(--bar); border: 1px solid var(--line); border-radius: 10px; font-size: 12px;
  }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 2px; background: var(--chip); border: 1px solid var(--line); border-radius: 7px; }
  .group > .label { padding: 0 6px; font-size: 11px; color: var(--muted); font-weight: 500; }
  .seg { border: 0; background: transparent; padding: 4px 8px; border-radius: 5px; color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
  .seg:hover { color: var(--ink); }
  .seg[aria-pressed="true"] { background: var(--panel); color: var(--blue); box-shadow: 0 1px 2px rgba(9, 30, 66, 0.12); }
  .toolbar select { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 3px 6px; font-size: 12px; font-weight: 500; }
  .dims { display: flex; align-items: center; gap: 4px; padding-left: 6px; margin-left: 4px; border-left: 1px solid var(--line); }
  .dims label { display: flex; align-items: center; gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; color: var(--muted); font-size: 11px; }
  .dims input { width: 46px; border: 0; background: transparent; padding: 2px 0; font: 500 12px 'IBM Plex Mono', monospace; color: var(--ink); text-align: center; outline: none; -moz-appearance: textfield; }
  .dims input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .icon { border: 0; background: transparent; padding: 4px; border-radius: 5px; color: var(--muted); display: inline-flex; }
  .icon:hover { color: var(--blue); background: var(--panel); }
  .icon[aria-pressed="true"] { color: var(--blue); }
  .icon svg { width: 15px; height: 15px; }
  .swatch { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(9, 30, 66, 0.25); padding: 0; margin: 0 2px; }
  .swatch[aria-pressed="true"] { outline: 2px solid var(--blue); outline-offset: 1px; }
  .danger { color: #C9372C; }
  [hidden] { display: none !important; }

  /* Stage */
  .stage {
    position: relative; flex: 1; min-height: 0; overflow: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background-color: var(--stage);
    background-image: linear-gradient(to right, var(--stage-line) 1px, transparent 1px), linear-gradient(to bottom, var(--stage-line) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .stage-inner { min-width: 100%; min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 48px; }
  .fit { position: relative; flex: none; }
  .device { position: absolute; top: 0; left: 0; transform-origin: 0 0; background: var(--finish, #111317); transition: background-color 0.2s; }
  .device .screen { position: absolute; overflow: hidden; background: #fff; }
  .device iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .device .island { position: absolute; background: #000; border-radius: 20px; z-index: 2; }
  .device.kind-phone { box-shadow: 0 30px 60px -20px rgba(9, 30, 66, 0.45), inset 0 0 0 2px rgba(255, 255, 255, 0.08); }
  .device.kind-tablet { box-shadow: 0 30px 60px -20px rgba(9, 30, 66, 0.4), inset 0 0 0 2px rgba(255, 255, 255, 0.08); }
  .device.kind-desktop { background: #DFE1E6; box-shadow: 0 20px 50px -20px rgba(9, 30, 66, 0.35); border: 1px solid #C1C7D0; }
  body[data-theme="dark"] .device.kind-desktop { background: #2C333A; border-color: #454F59; }
  .device .chrome { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 14px; padding: 0 14px; font-size: 13px; color: #44546F; }
  body[data-theme="dark"] .device .chrome { color: #9FADBC; }
  .device .chrome .lights { display: flex; gap: 7px; }
  .device .chrome .lights i { width: 11px; height: 11px; border-radius: 50%; background: #C1C7D0; }
  .device .chrome .address { flex: 1; max-width: 560px; margin: 0 auto; height: 26px; border-radius: 6px; background: rgba(255, 255, 255, 0.75); display: flex; align-items: center; padding: 0 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  body[data-theme="dark"] .device .chrome .address { background: rgba(0, 0, 0, 0.25); }
  .device.kind-plain { background: transparent; box-shadow: 0 0 0 1px var(--line), 0 20px 50px -24px rgba(9, 30, 66, 0.35); }

  /* Overlays, drawn in screen pixels over the scaled device */
  .overlay { position: absolute; pointer-events: none; z-index: 5; overflow: hidden; }
  .overlay .cols { position: absolute; inset: 0; display: flex; }
  .overlay .cols span { background: rgba(255, 86, 48, 0.12); border-left: 1px solid rgba(255, 86, 48, 0.35); border-right: 1px solid rgba(255, 86, 48, 0.35); }
  .overlay .grid8 { position: absolute; inset: 0; }
  .overlay .zone { position: absolute; background: rgba(201, 55, 44, 0.16); border: 1px dashed rgba(201, 55, 44, 0.6); }
  .overlay .zone em { position: absolute; left: 6px; top: 4px; font: 500 10px 'IBM Plex Mono', monospace; color: #AE2E24; font-style: normal; background: rgba(255, 255, 255, 0.85); padding: 0 4px; border-radius: 3px; }
  .guide { position: absolute; pointer-events: auto; background: var(--guide); }
  .guide.h { left: 0; right: 0; height: 1px; cursor: row-resize; }
  .guide.v { top: 0; bottom: 0; width: 1px; cursor: col-resize; }
  .guide::before { content: ''; position: absolute; inset: -4px; }
  .guide:hover, .guide.dragging { background: var(--guide-active); }
  .guide b { position: absolute; font: 500 10px 'IBM Plex Mono', monospace; color: #fff; background: var(--guide-active); padding: 1px 4px; border-radius: 3px; white-space: nowrap; display: none; }
  .guide.h b { left: 4px; top: 3px; }
  .guide.v b { top: 4px; left: 3px; }
  .guide:hover b, .guide.dragging b { display: block; }
  .ruler { position: absolute; z-index: 6; background: var(--bar); cursor: crosshair; box-shadow: 0 0 0 1px var(--line); }

  /* Footer */
  .bottom { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding: 12px 20px; }
  .status { margin: 0; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #22A06B; flex: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 14px; font-size: 13px; font-weight: 500; text-decoration: none; color: var(--ink); }
  .btn:hover { background: var(--bar); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: var(--blue-hover); }
  body[data-theme="dark"] .btn.primary { color: #1D2125; }

  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 20px; background: var(--panel); color: var(--ink); max-width: 320px; text-align: center; }
  dialog::backdrop { background: rgba(9, 30, 66, 0.55); }
  dialog img { width: 220px; height: 220px; display: block; margin: 12px auto; background: #fff; padding: 8px; border-radius: 8px; }
  dialog p { margin: 0; font-size: 13px; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<main class="panel">
  <header class="top">
    <div class="brand">
      <img alt="Flowlogs" height="36" src="img/logo-144.png" width="36"/>
      <div>
        <h1>Flowlogs device preview</h1>
        <p>The landing pages on a phone, a tablet and a desktop</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="group" role="group" aria-label="Page">
        <button class="seg" data-page="index.html" type="button">English</button>
        <button class="seg" data-page="ar.html" lang="ar" type="button">العربية</button>
        <button class="seg" data-page="editorial.html" type="button">Editorial</button>
      </div>
      <a class="link" id="open-page" rel="noopener" target="_blank">Open live page</a>
    </div>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Preview settings">
    <div class="group">
      <select aria-label="Device" id="device">
        <option value="iphone">iPhone 15 Pro (390 × 844)</option>
        <option value="pixel">Pixel 8 (412 × 915)</option>
        <option value="ipad">iPad Air (820 × 1180)</option>
        <option value="laptop">Laptop (1280 × 800)</option>
        <option value="desktop">Desktop (1440 × 900)</option>
        <option value="custom">Custom size</option>
      </select>
      <div class="dims">
        <label>W <input aria-label="Width in pixels" id="w" max="2560" min="280" type="number"/></label>
        <button aria-label="Keep the aspect ratio" class="icon" id="lock" title="Keep the aspect ratio" type="button">
          <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        </button>
        <label>H <input aria-label="Height in pixels" id="h" max="2560" min="280" type="number"/></label>
        <button aria-label="Rotate" class="icon" id="rotate" title="Rotate (swap width and height)" type="button">
          <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
        </button>
      </div>
    </div>
    <div class="group" role="group" aria-label="Orientation">
      <button class="seg" data-orient="portrait" type="button">Portrait</button>
      <button class="seg" data-orient="landscape" type="button">Landscape</button>
    </div>
    <div class="group" role="group" aria-label="Social ratios">
      <span class="label">Ratio</span>
      <button class="seg" data-ratio="1280x720" title="16:9 at 1280 × 720" type="button">16:9</button>
      <button class="seg" data-ratio="405x720" title="9:16 at 405 × 720" type="button">9:16</button>
      <button class="seg" data-ratio="720x720" title="1:1 at 720 × 720" type="button">1:1</button>
      <button class="seg" data-ratio="576x720" title="4:5 at 576 × 720" type="button">4:5</button>
    </div>
    <div class="group">
      <span class="label">Guides</span>
      <select aria-label="Guides" id="guides">
        <option value="none">Off</option>
        <option value="columns">Layout columns</option>
        <option value="safe">Device safe areas</option>
        <option value="instagram">Instagram story safe zone</option>
        <option value="tiktok">TikTok safe zone</option>
      </select>
    </div>
    <div class="group" role="group" aria-label="Measure">
      <button class="seg" id="rulers" type="button">Rulers</button>
      <button class="seg" id="grid" title="8 px grid" type="button">Grid</button>
      <button class="seg danger" hidden id="clear-guides" title="Remove the guides you placed" type="button">Clear guides (<span id="guide-count">0</span>)</button>
    </div>
    <div class="group" role="group" aria-label="Theme of this tool">
      <button class="seg" data-theme="light" type="button">Light</button>
      <button class="seg" data-theme="dark" type="button">Dark</button>
    </div>
    <div class="group" role="group" aria-label="Device finish" style="padding: 4px 6px;">
      <button aria-label="Black" class="swatch" data-finish="#111317" style="background:#111317" title="Black" type="button"></button>
      <button aria-label="Natural titanium" class="swatch" data-finish="#7A746D" style="background:#7A746D" title="Natural titanium" type="button"></button>
      <button aria-label="Silver" class="swatch" data-finish="#D6D8DB" style="background:#D6D8DB" title="Silver" type="button"></button>
      <button aria-label="Blue titanium" class="swatch" data-finish="#2B3646" style="background:#2B3646" title="Blue titanium" type="button"></button>
    </div>
    <div class="group">
      <span class="label">Zoom</span>
      <select aria-label="Zoom" id="zoom">
        <option value="fit">Fit</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
      </select>
    </div>
    <button class="seg" id="scan" type="button">Scan on device</button>
  </div>

  <section aria-label="Preview" class="stage" id="stage">
    <div class="stage-inner" id="stage-inner">
      <div class="fit" id="fit">
        <div class="device" id="device-frame">
          <div class="chrome" hidden id="chrome"><span class="lights"><i></i><i></i><i></i></span><span class="address" id="address"></span></div>
          <div class="island" hidden id="island"></div>
          <div class="screen" id="screen"><iframe id="frame" title="Page preview"></iframe></div>
        </div>
      </div>
    </div>
    <canvas aria-hidden="true" class="ruler" hidden id="ruler-x" title="Drag down to place a guide"></canvas>
    <canvas aria-hidden="true" class="ruler" hidden id="ruler-y" title="Drag right to place a guide"></canvas>
    <div class="overlay" id="overlay"></div>
  </section>

  <footer class="bottom">
    <p class="status"><span class="dot"></span><span id="status"></span></p>
    <div class="actions">
      <button class="btn" id="copy" type="button">Copy preview link</button>
      <a class="btn" download="" href="flowlogs-assets.zip">Download assets</a>
      <a class="btn primary" href="https://marketplace.atlassian.com/search?query=flowlogs" rel="noopener" target="_blank">Install on Jira Cloud</a>
    </div>
  </footer>
</main>

<dialog id="qr">
  <strong>Open this page on your phone</strong>
  <img alt="QR code for the page" id="qr-img"/>
  <p id="qr-url"></p>
  <form method="dialog"><button class="btn" style="margin-top:14px" type="submit">Close</button></form>
</dialog>

<script>
(() => {
  const SITE = 'https://omarelmougy1-afk.github.io/flowlogs-site/';
  const DEVICES = {
    iphone: { w: 390, h: 844, kind: 'phone', name: 'iPhone 15 Pro' },
    pixel: { w: 412, h: 915, kind: 'phone', name: 'Pixel 8' },
    ipad: { w: 820, h: 1180, kind: 'tablet', name: 'iPad Air' },
    laptop: { w: 1280, h: 800, kind: 'desktop', name: 'Laptop' },
    desktop: { w: 1440, h: 900, kind: 'desktop', name: 'Desktop' },
  };
  const PAGES = { 'index.html': 'English page', 'ar.html': 'Arabic page', 'editorial.html': 'Editorial page' };
  // Unsafe bands as fractions of the screen: [top, right, bottom, left].
  const SOCIAL = {
    instagram: { label: 'Instagram story', bands: [250 / 1920, 0, 340 / 1920, 0] },
    tiktok: { label: 'TikTok', bands: [160 / 1920, 140 / 1080, 480 / 1920, 0] },
  };

  const $ = id => document.getElementById(id);
  const stage = $('stage'), inner = $('stage-inner'), fit = $('fit'), frameBox = $('device-frame');
  const screen = $('screen'), frame = $('frame'), overlay = $('overlay');
  const rulerX = $('ruler-x'), rulerY = $('ruler-y');

  const state = {
    page: 'index.html', device: 'iphone', w: 390, h: 844, kind: 'phone', guides: 'none', rulers: false, grid: false,
    theme: 'light', finish: '#111317', zoom: 'fit', lock: false, lines: [],
  };

  // --- state in the URL, so a copied link opens the same view ------------------------
  const save = () => {
    const p = new URLSearchParams();
    p.set('page', state.page);
    p.set('device', state.device);
    p.set('size', `${state.w}x${state.h}`);
    if (state.kind !== (DEVICES[state.device] || {}).kind) p.set('kind', state.kind);
    if (state.guides !== 'none') p.set('guides', state.guides);
    if (state.rulers) p.set('rulers', '1');
    if (state.grid) p.set('grid', '1');
    if (state.theme !== 'light') p.set('theme', state.theme);
    if (state.finish !== '#111317') p.set('finish', state.finish.slice(1));
    if (state.zoom !== 'fit') p.set('zoom', state.zoom);
    if (state.lines.length) p.set('lines', state.lines.map(l => `${l.axis}${Math.round(l.pos)}`).join('.'));
    history.replaceState(null, '', `#${p}`);
  };
  const load = () => {
    const p = new URLSearchParams(location.hash.slice(1));
    if (PAGES[p.get('page')]) state.page = p.get('page');
    if (DEVICES[p.get('device')] || p.get('device') === 'custom') state.device = p.get('device');
    const preset = DEVICES[state.device];
    if (preset) Object.assign(state, { w: preset.w, h: preset.h, kind: preset.kind });
    const size = (p.get('size') || '').match(/^(\d+)x(\d+)$/);
    if (size) Object.assign(state, { w: clamp(+size[1]), h: clamp(+size[2]) });
    if (['phone', 'tablet', 'desktop', 'plain'].includes(p.get('kind'))) state.kind = p.get('kind');
    else if (!preset) state.kind = kindFor(state.w, state.h);
    if (['columns', 'safe', 'instagram', 'tiktok'].includes(p.get('guides'))) state.guides = p.get('guides');
    state.rulers = p.get('rulers') === '1';
    state.grid = p.get('grid') === '1';
    if (p.get('theme') === 'dark') state.theme = 'dark';
    if (/^[0-9a-f]{6}$/i.test(p.get('finish') || '')) state.finish = `#${p.get('finish')}`;
    if (['0.5', '0.75', '1'].includes(p.get('zoom'))) state.zoom = p.get('zoom');
    state.lines = (p.get('lines') || '').split('.').map(s => s.match(/^([hv])(\d+)$/)).filter(Boolean).map(m => ({ axis: m[1], pos: +m[2] }));
  };
  const clamp = n => Math.max(280, Math.min(2560, Math.round(n) || 280));
  const kindFor = (w, h) => (Math.min(w, h) < 600 ? 'phone' : Math.min(w, h) < 1000 && Math.max(w, h) < 1400 ? 'tablet' : 'desktop');

  // --- device geometry ------------------------------------------------------------------
  const geometry = () => {
    const { w, h, kind } = state;
    const landscape = w > h;
    if (kind === 'phone') return { pad: [14, 14, 14, 14], radius: 56, inner: 44, island: landscape ? 'left' : 'top' };
    if (kind === 'tablet') return { pad: [22, 22, 22, 22], radius: 36, inner: 16, island: null };
    if (kind === 'desktop') return { pad: [40, 0, 0, 0], radius: 10, inner: 0, island: null, chrome: true };
    return { pad: [0, 0, 0, 0], radius: 4, inner: 4, island: null };
  };

  let scale = 1;
  const layout = () => {
    const g = geometry();
    const [pt, pr, pb, pl] = g.pad;
    const outerW = state.w + pl + pr, outerH = state.h + pt + pb;
    const room = { w: stage.clientWidth - 96, h: stage.clientHeight - 96 };
    scale = state.zoom === 'fit' ? Math.min(1, room.w / outerW, room.h / outerH) : +state.zoom;
    scale = Math.max(0.1, scale);

    frameBox.className = `device kind-${state.kind}`;
    frameBox.style.width = `${outerW}px`;
    frameBox.style.height = `${outerH}px`;
    frameBox.style.borderRadius = `${g.radius}px`;
    frameBox.style.transform = `scale(${scale})`;
    frameBox.style.setProperty('--finish', state.finish);
    fit.style.width = `${outerW * scale}px`;
    fit.style.height = `${outerH * scale}px`;
    Object.assign(screen.style, { left: `${pl}px`, top: `${pt}px`, width: `${state.w}px`, height: `${state.h}px`, borderRadius: g.chrome ? '0 0 9px 9px' : `${g.inner}px` });

    $('chrome').hidden = !g.chrome;
    if (g.chrome) $('chrome').style.height = `${pt}px`;
    const island = $('island');
    island.hidden = !g.island;
    if (g.island === 'top') Object.assign(island.style, { width: '124px', height: '36px', left: `${pl + state.w / 2 - 62}px`, top: `${pt + 11}px` });
    if (g.island === 'left') Object.assign(island.style, { width: '36px', height: '124px', left: `${pl + 11}px`, top: `${pt + state.h / 2 - 62}px` });

    requestAnimationFrame(drawOverlay);
  };

  // Screen rectangle in stage coordinates (the stage scrolls, overlays scroll with it).
  const screenRect = () => {
    const s = screen.getBoundingClientRect(), st = stage.getBoundingClientRect();
    return { x: s.left - st.left + stage.scrollLeft, y: s.top - st.top + stage.scrollTop, w: s.width, h: s.height };
  };

  // --- overlays -------------------------------------------------------------------------
  const drawOverlay = () => {
    const r = screenRect();
    Object.assign(overlay.style, { left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px` });
    let html = '';
    if (state.guides === 'columns') {
      // Columns from the design system: 12 / 8 / 4 with its gutters, margins and 1200 px container.
      const spec = state.w >= 1024 ? [12, 24, 32] : state.w >= 768 ? [8, 20, 24] : [4, 16, 20];
      const [count, gutter, margin] = spec;
      const content = Math.min(1200, state.w - margin * 2);
      const left = (state.w - content) / 2;
      html += `<div class="cols" style="left:${left * scale}px;right:${left * scale}px;gap:${gutter * scale}px">${'<span style="flex:1"></span>'.repeat(count)}</div>`;
    }
    if (state.guides === 'safe') {
      const landscape = state.w > state.h;
      const bands = state.kind === 'phone' ? (landscape ? [0, 59, 21, 59] : [59, 0, 34, 0]) : state.kind === 'tablet' ? [24, 0, 20, 0] : [0, 0, 0, 0];
      html += zones(bands.map((v, i) => v / (i % 2 ? state.w : state.h)), 'unsafe');
    }
    if (SOCIAL[state.guides]) html += zones(SOCIAL[state.guides].bands, SOCIAL[state.guides].label);
    if (state.grid) {
      const step = 8 * scale;
      html += `<div class="grid8" style="background-image:linear-gradient(to right,rgba(12,102,228,.14) 1px,transparent 1px),linear-gradient(to bottom,rgba(12,102,228,.14) 1px,transparent 1px);background-size:${step}px ${step}px"></div>`;
    }
    state.lines.forEach((line, i) => {
      const at = line.pos * scale;
      html += `<div class="guide ${line.axis}" data-i="${i}" style="${line.axis === 'h' ? `top:${at}px` : `left:${at}px`}" title="Drag to move, double-click to remove"><b>${line.axis === 'h' ? 'y' : 'x'} ${Math.round(line.pos)}</b></div>`;
    });
    overlay.innerHTML = html;
    $('guide-count').textContent = state.lines.length;
    $('clear-guides').hidden = !state.lines.length;
    drawRulers(r);
  };
  const zones = ([t, rt, b, l], label) => {
    const out = [];
    if (t) out.push(`<div class="zone" style="left:0;right:0;top:0;height:${t * 100}%"><em>${label} ${Math.round(t * state.h)} px</em></div>`);
    if (b) out.push(`<div class="zone" style="left:0;right:0;bottom:0;height:${b * 100}%"><em>${label} ${Math.round(b * state.h)} px</em></div>`);
    if (l) out.push(`<div class="zone" style="top:0;bottom:0;left:0;width:${l * 100}%"></div>`);
    if (rt) out.push(`<div class="zone" style="top:0;bottom:0;right:0;width:${rt * 100}%"></div>`);
    return out.join('');
  };

  const RULER = 20;
  const drawRulers = r => {
    rulerX.hidden = rulerY.hidden = !state.rulers;
    if (!state.rulers) return;
    const dpr = window.devicePixelRatio || 1;
    const styles = getComputedStyle(document.body);
    const ink = styles.getPropertyValue('--muted').trim();
    const paint = (canvas, length, horizontal) => {
      canvas.width = Math.round((horizontal ? length : RULER) * dpr);
      canvas.height = Math.round((horizontal ? RULER : length) * dpr);
      canvas.style.width = `${horizontal ? length : RULER}px`;
      canvas.style.height = `${horizontal ? RULER : length}px`;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.strokeStyle = ink;
      ctx.fillStyle = ink;
      ctx.lineWidth = 1;
      ctx.font = "500 9px 'IBM Plex Mono', monospace";
      const max = horizontal ? state.w : state.h;
      const label = scale < 0.35 ? 200 : scale < 0.7 ? 100 : 50;
      const minor = label / 5;
      for (let v = 0; v <= max; v += minor) {
        const at = Math.round(v * scale) + 0.5;
        const size = v % label === 0 ? RULER : v % (label / 2) === 0 ? 9 : 5;
        ctx.beginPath();
        if (horizontal) { ctx.moveTo(at, RULER); ctx.lineTo(at, RULER - size); }
        else { ctx.moveTo(RULER, at); ctx.lineTo(RULER - size, at); }
        ctx.stroke();
        if (v % label === 0 && v > 0) {
          if (horizontal) ctx.fillText(String(v), at + 3, 9);
          else { ctx.save(); ctx.translate(9, at + 3); ctx.rotate(Math.PI / 2); ctx.fillText(String(v), 0, 0); ctx.restore(); }
        }
      }
    };
    paint(rulerX, r.w, true);
    paint(rulerY, r.h, false);
    Object.assign(rulerX.style, { left: `${r.x}px`, top: `${r.y - RULER - 4}px` });
    Object.assign(rulerY.style, { left: `${r.x - RULER - 4}px`, top: `${r.y}px` });
  };

  // --- guides: drag from a ruler to place, drag to move, drag off or double-click to remove
  const pagePos = (event, axis) => {
    const r = screen.getBoundingClientRect();
    return axis === 'h' ? (event.clientY - r.top) / scale : (event.clientX - r.left) / scale;
  };
  const dragGuide = (index, event) => {
    const line = state.lines[index];
    const move = e => {
      line.pos = pagePos(e, line.axis);
      const el = overlay.querySelector(`[data-i="${index}"]`);
      if (el) {
        el.style[line.axis === 'h' ? 'top' : 'left'] = `${line.pos * scale}px`;
        el.querySelector('b').textContent = `${line.axis === 'h' ? 'y' : 'x'} ${Math.round(line.pos)}`;
        el.classList.add('dragging');
      }
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      const limit = line.axis === 'h' ? state.h : state.w;
      if (line.pos < 0 || line.pos > limit) state.lines.splice(index, 1);
      else line.pos = Math.round(line.pos);
      save();
      drawOverlay();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    move(event);
  };
  rulerX.addEventListener('pointerdown', e => {
    e.preventDefault();
    state.lines.push({ axis: 'h', pos: 0 });
    drawOverlay();
    dragGuide(state.lines.length - 1, e);
  });
  rulerY.addEventListener('pointerdown', e => {
    e.preventDefault();
    state.lines.push({ axis: 'v', pos: 0 });
    drawOverlay();
    dragGuide(state.lines.length - 1, e);
  });
  overlay.addEventListener('pointerdown', e => {
    const el = e.target.closest('.guide');
    if (!el) return;
    e.preventDefault();
    dragGuide(+el.dataset.i, e);
  });
  overlay.addEventListener('dblclick', e => {
    const el = e.target.closest('.guide');
    if (!el) return;
    state.lines.splice(+el.dataset.i, 1);
    save();
    drawOverlay();
  });
  $('clear-guides').addEventListener('click', () => {
    state.lines = [];
    save();
    drawOverlay();
  });

  // --- controls -------------------------------------------------------------------------
  const pressed = (selector, test) => document.querySelectorAll(selector).forEach(el => el.setAttribute('aria-pressed', String(test(el))));
  const breakpoint = w => (w >= 1280 ? 'wide desktop layout' : w >= 1024 ? 'desktop layout' : w >= 768 ? 'tablet layout' : w >= 640 ? 'large phone layout' : 'phone layout');

  const render = ({ reload = false } = {}) => {
    document.body.dataset.theme = state.theme;
    $('device').value = state.device;
    $('w').value = state.w;
    $('h').value = state.h;
    $('guides').value = state.guides;
    $('zoom').value = state.zoom;
    pressed('[data-page]', el => el.dataset.page === state.page);
    pressed('[data-orient]', el => (el.dataset.orient === 'landscape') === state.w > state.h);
    pressed('[data-ratio]', el => state.kind === 'plain' && el.dataset.ratio === `${state.w}x${state.h}`);
    pressed('[data-theme]', el => el.dataset.theme === state.theme);
    pressed('[data-finish]', el => el.dataset.finish.toLowerCase() === state.finish.toLowerCase());
    pressed('#rulers', () => state.rulers);
    pressed('#grid', () => state.grid);
    pressed('#lock', () => state.lock);
    document.querySelectorAll('[data-finish]').forEach(el => (el.disabled = !['phone', 'tablet'].includes(state.kind)));
    const live = new URL(state.page, SITE).href;
    $('open-page').href = state.page;
    $('address').textContent = live.replace(/^https:\/\//, '');
    const preset = DEVICES[state.device];
    const matches = preset && [preset.w, preset.h].sort().join() === [state.w, state.h].sort().join();
    const device = state.kind === 'plain' ? 'a social post frame' : matches ? preset.name : 'a custom screen';
    $('status').textContent = `${PAGES[state.page]} on ${device} at ${state.w} × ${state.h}: ${breakpoint(state.w)}`;
    if (reload || !frame.src) frame.src = state.page;
    save();
    layout();
  };

  const setSize = (w, h, kind) => {
    state.w = clamp(w);
    state.h = clamp(h);
    state.kind = kind || kindFor(state.w, state.h);
  };

  document.querySelectorAll('[data-page]').forEach(el =>
    el.addEventListener('click', () => {
      state.page = el.dataset.page;
      render({ reload: true });
    }),
  );
  $('device').addEventListener('change', e => {
    state.device = e.target.value;
    const preset = DEVICES[state.device];
    if (preset) {
      const landscape = state.w > state.h;
      setSize(landscape ? preset.h : preset.w, landscape ? preset.w : preset.h, preset.kind);
      if (preset.kind === 'desktop') setSize(preset.w, preset.h, preset.kind);
    } else state.kind = kindFor(state.w, state.h);
    render();
  });
  const onDims = changed => {
    const w = +$('w').value, h = +$('h').value;
    if (!w || !h) return;
    const ratio = state.h / state.w;
    if (state.lock && changed === 'w') setSize(w, w * ratio);
    else if (state.lock && changed === 'h') setSize(h / ratio, h);
    else setSize(w, h);
    state.device = 'custom';
    render();
  };
  $('w').addEventListener('change', () => onDims('w'));
  $('h').addEventListener('change', () => onDims('h'));
  $('lock').addEventListener('click', () => {
    state.lock = !state.lock;
    render();
  });
  const rotate = () => {
    setSize(state.h, state.w, state.kind);
    state.lines = state.lines.map(l => ({ axis: l.axis === 'h' ? 'v' : 'h', pos: l.pos }));
    render();
  };
  $('rotate').addEventListener('click', rotate);
  document.querySelectorAll('[data-orient]').forEach(el =>
    el.addEventListener('click', () => {
      if ((el.dataset.orient === 'landscape') !== state.w > state.h && state.w !== state.h) rotate();
    }),
  );
  document.querySelectorAll('[data-ratio]').forEach(el =>
    el.addEventListener('click', () => {
      const [w, h] = el.dataset.ratio.split('x').map(Number);
      setSize(w, h, 'plain');
      state.device = 'custom';
      render();
    }),
  );
  $('guides').addEventListener('change', e => {
    state.guides = e.target.value;
    render();
  });
  $('rulers').addEventListener('click', () => {
    state.rulers = !state.rulers;
    render();
  });
  $('grid').addEventListener('click', () => {
    state.grid = !state.grid;
    render();
  });
  document.querySelectorAll('[data-theme]').forEach(el =>
    el.addEventListener('click', () => {
      state.theme = el.dataset.theme;
      render();
    }),
  );
  document.querySelectorAll('[data-finish]').forEach(el =>
    el.addEventListener('click', () => {
      state.finish = el.dataset.finish;
      render();
    }),
  );
  $('zoom').addEventListener('change', e => {
    state.zoom = e.target.value;
    render();
  });
  $('copy').addEventListener('click', async () => {
    const link = location.href;
    try {
      await navigator.clipboard.writeText(link);
      $('copy').textContent = 'Link copied';
    } catch {
      window.prompt('Copy this link', link);
    }
    setTimeout(() => ($('copy').textContent = 'Copy preview link'), 1800);
  });
  $('scan').addEventListener('click', () => {
    const live = new URL(state.page, SITE).href;
    $('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=440x440&margin=0&data=${encodeURIComponent(live)}`;
    $('qr-url').textContent = live;
    $('qr').showModal();
  });

  new ResizeObserver(() => layout()).observe(stage);
  stage.addEventListener('scroll', () => drawOverlay());
  window.addEventListener('hashchange', () => {
    const page = state.page;
    load();
    render({ reload: page !== state.page });
  });

  load();
  render({ reload: true });
})();
</script>
</body>
</html>
